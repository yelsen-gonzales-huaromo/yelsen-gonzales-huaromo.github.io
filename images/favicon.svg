<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <linearGradient id="gradient1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="leftArmTop" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#d946ef;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="rightArmTop" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#d946ef;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#7000ff;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="leftArmOuter" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0084ff;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="rightArmOuter" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="armInner" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4c1d95;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="leftTransition" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#0284c7;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="rightTransition" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#3730a3;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="stemLeft" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0055ff;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="stemRight" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" style="stop-color:#0055ff;stop-opacity:1" />
          <stop offset="100%" style="stop-color:#0022aa;stop-opacity:1" />
        </linearGradient>
        <filter id="glow">
            <feGaussianBlur stdDeviation="1" result="coloredBlur" />
            <feMerge>
                <feMergeNode in="coloredBlur" />
                <feMergeNode in="SourceGraphic" />
            </feMerge>
        </filter>
    </defs>

    <!-- Squircle container -->
    <rect x="10" y="10" width="180" height="180" rx="46" 
          fill="#090d16" 
          stroke="url(#gradient1)" 
          stroke-width="2.5"/>

    <!-- Nested SVG to scale the 3D Y shape perfectly inside the favicon -->
    <svg x="22" y="22" width="156" height="156" viewBox="20 35 160 145" filter="url(#glow)">
      <!-- Left Arm - End Face -->
      <path d="M 28 65.2 L 64 44.4 L 64 68.4 L 28 89.2 Z" 
            fill="url(#leftArmTop)" 
            stroke="url(#leftArmTop)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Left Arm - Top Face (Purple/Magenta) -->
      <path d="M 28 65.2 L 64 44.4 L 100 65.2 L 100 106.8 Z" 
            fill="url(#leftArmTop)" 
            stroke="url(#leftArmTop)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Left Arm - Outer Face (Cyan) -->
      <path d="M 28 65.2 L 100 106.8 L 100 130.8 L 28 89.2 Z" 
            fill="url(#leftArmOuter)" 
            stroke="url(#leftArmOuter)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Left Arm - Inner Face (Dark Shadow) -->
      <path d="M 64 44.4 L 100 65.2 L 100 89.2 L 64 68.4 Z" 
            fill="url(#armInner)" 
            stroke="url(#armInner)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />

      <!-- Right Arm - End Face -->
      <path d="M 172 65.2 L 136 44.4 L 136 68.4 L 172 89.2 Z" 
            fill="url(#rightArmTop)" 
            stroke="url(#rightArmTop)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Right Arm - Top Face (Purple/Magenta) -->
      <path d="M 172 65.2 L 136 44.4 L 100 65.2 L 100 106.8 Z" 
            fill="url(#rightArmTop)" 
            stroke="url(#rightArmTop)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Right Arm - Outer Face (Deep Blue/Purple) -->
      <path d="M 172 65.2 L 100 106.8 L 100 130.8 L 172 89.2 Z" 
            fill="url(#rightArmOuter)" 
            stroke="url(#rightArmOuter)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Right Arm - Inner Face (Dark Shadow) -->
      <path d="M 136 44.4 L 100 65.2 L 100 89.2 L 136 68.4 Z" 
            fill="url(#armInner)" 
            stroke="url(#armInner)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />

      <!-- Left Transition Face (Medium Blue Shadow) -->
      <path d="M 64 110 L 100 89.2 L 100 130.8 Z" 
            fill="url(#leftTransition)" 
            stroke="url(#leftTransition)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Right Transition Face (Indigo Shadow) -->
      <path d="M 136 110 L 100 89.2 L 100 130.8 Z" 
            fill="url(#rightTransition)" 
            stroke="url(#rightTransition)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />

      <!-- Stem - Left Face (Cyan/Blue) -->
      <path d="M 64 110 L 100 130.8 L 100 170.8 L 64 150 Z" 
            fill="url(#stemLeft)" 
            stroke="url(#stemLeft)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
            
      <!-- Stem - Right Face (Vibrant Blue) -->
      <path d="M 136 110 L 100 130.8 L 100 170.8 L 136 150 Z" 
            fill="url(#stemRight)" 
            stroke="url(#stemRight)" 
            stroke-width="0.5" 
            stroke-linejoin="round" />
    </svg>
</svg>